services:

  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    profiles: ["dev"]

  backend:
    build:
      context: ./backend
    env_file: .env
    profiles: ["dev"]
    networks:
      default:
        aliases:
          - backend

  # Backend + built frontend in one container, reached via the shared reverse proxy
  app:
    build:
      context: .
    env_file: .env
    profiles: ["prod"]
    networks:
      proxy:
        aliases:
          - home-dashboard
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend/src:/app/src
    profiles: ["dev"]
    networks:
      default:
        aliases:
          - frontend

networks:
  # Shared with the central reverse proxy on octane; create once: docker network create proxy
  proxy:
    external: true
